name: Update formula

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - dayglass-release

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update release URL and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.client_payload.tag }}"
          if [ -z "$tag" ]; then
            tag="$(gh api repos/Gigooo-organization/dayglass/releases/latest --jq .tag_name)"
          fi
          version="${tag#v}"
          url="https://github.com/Gigooo-organization/dayglass/archive/refs/tags/${tag}.tar.gz"
          sha256="$(curl -LfsS "$url" | sha256sum | cut -d ' ' -f 1)"
          FORMULA_URL="$url" FORMULA_SHA256="$sha256" ruby <<'RUBY'
          path = "Formula/dayglass.rb"
          text = File.read(path)
          url = ENV.fetch("FORMULA_URL")
          sha256 = ENV.fetch("FORMULA_SHA256")
          text = text.sub(/url "[^"]+"/, "url \"#{url}\"")
          text = text.sub(/sha256 "[^"]+"/, "sha256 \"#{sha256}\"")
          File.write(path, text)
          RUBY
      - name: Commit formula
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/dayglass.rb
          git commit -m "chore: update dayglass formula"
          git push
