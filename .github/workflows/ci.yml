name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  formula:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Prepare local tap
        run: |
          brew tap-new --no-git gigooo-organization/dayglass
          tap_path="$(brew --repository)/Library/Taps/gigooo-organization/homebrew-dayglass"
          mkdir -p "$tap_path/Formula"
          cp Formula/dayglass.rb "$tap_path/Formula/dayglass.rb"
      - name: Style
        run: brew style --formula gigooo-organization/dayglass/dayglass
      - name: Audit
        run: brew audit --formula --strict gigooo-organization/dayglass/dayglass
      - name: Build formula source
        shell: bash
        run: |
          set -euo pipefail
          source_url="$(ruby -e 'puts File.read("Formula/dayglass.rb")[/url "([^"]+)"/, 1]')"
          tmp="$(mktemp -d)"
          curl -LfsS "$source_url" | tar -xz -C "$tmp"
          source_dir="$(find "$tmp" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          swift build --package-path "$source_dir" --disable-sandbox -c release
          bin_path="$(swift build --package-path "$source_dir" --disable-sandbox -c release --show-bin-path)"
          "$bin_path/dayglass" --version
