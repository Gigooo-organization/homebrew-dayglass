name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  formula:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Style
        run: brew style --formula Formula/dayglass.rb
      - name: Audit
        run: brew audit --formula --strict Formula/dayglass.rb
      - name: Test
        run: brew test Formula/dayglass.rb
